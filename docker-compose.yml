version: "3.8"

services:
  controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    container_name: controller
    ports:
      - "8000:8000"
    environment:
      - CONTROLLER_HOST=0.0.0.0
      - CONTROLLER_PORT=8000
      - DATA_DIR=/data
      - CHUNK_SIZE=1048576
      - REPLICATION_FACTOR=2
      - HEARTBEAT_TIMEOUT=6.0
      - HEAL_CHECK_INTERVAL=2.0
    volumes:
      - controller_data:/data
    networks:
      - storage-net
    restart: unless-stopped

  worker1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker1
    environment:
      - WORKER_ID=worker1
      - WORKER_HOST=worker1
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - DATA_DIR=/data
      - HEARTBEAT_INTERVAL=2.0
    volumes:
      - worker1_data:/data
    networks:
      - storage-net
    depends_on:
      - controller
    restart: unless-stopped

  worker2:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker2
    environment:
      - WORKER_ID=worker2
      - WORKER_HOST=worker2
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - DATA_DIR=/data
      - HEARTBEAT_INTERVAL=2.0
    volumes:
      - worker2_data:/data
    networks:
      - storage-net
    depends_on:
      - controller
    restart: unless-stopped

  worker3:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker3
    environment:
      - WORKER_ID=worker3
      - WORKER_HOST=worker3
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - DATA_DIR=/data
      - HEARTBEAT_INTERVAL=2.0
    volumes:
      - worker3_data:/data
    networks:
      - storage-net
    depends_on:
      - controller
    restart: unless-stopped

  worker4:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker4
    environment:
      - WORKER_ID=worker4
      - WORKER_HOST=worker4
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - DATA_DIR=/data
      - HEARTBEAT_INTERVAL=2.0
    volumes:
      - worker4_data:/data
    networks:
      - storage-net
    depends_on:
      - controller
    restart: unless-stopped

volumes:
  controller_data:
  worker1_data:
  worker2_data:
  worker3_data:
  worker4_data:

networks:
  storage-net:
    name: storage-net
    driver: bridge
